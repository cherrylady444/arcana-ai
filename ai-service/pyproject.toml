[project]
name = "ai-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]==0.139.2",
    "openai==2.46.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
]

[dependency-groups]
dev = [
    "httpx2==2.7.0",
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

